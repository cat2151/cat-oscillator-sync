name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/typescript/browser/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# Set explicit permissions for the GITHUB_TOKEN
permissions:
  contents: write  # Need write to commit and push to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/typescript/browser/package-lock.json

      - name: Install dependencies
        run: |
          cd src/typescript/browser
          npm ci

      - name: Build application
        run: |
          cd src/typescript/browser
          npm run build

      - name: Create .nojekyll file
        run: touch docs/.nojekyll

      - name: Commit and push to main
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git diff --staged --quiet || (git commit -m "Deploy: Update GitHub Pages [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
